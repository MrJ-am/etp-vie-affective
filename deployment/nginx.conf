# Fragment à instancier dans un vhost HTTPS dédié ; certificats gérés par l’hébergeur.
# Ne pas copier example.invalid dans une configuration active.
server {
    listen 443 ssl;
    server_name carnet.example.invalid;
    ssl_certificate /etc/ssl/etp/fullchain.pem;
    ssl_certificate_key /etc/ssl/etp/key.pem;
    client_max_body_size 4000000;
    client_body_timeout 15s;
    access_log off;
    location / {
        proxy_pass http://127.0.0.1:3017;
        proxy_set_header Host $host;
        proxy_read_timeout 20s;
        proxy_send_timeout 20s;
        proxy_connect_timeout 5s;
    }
}
