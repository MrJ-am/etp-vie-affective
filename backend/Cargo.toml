[package]
name = "etp-carnet-server"
version = "0.2.0"
edition = "2024"
license = "LGPL-3.0-or-later"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "postgres", "uuid", "json"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
rand = "0.8"
scrypt = "0.11"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
subtle = "2"
